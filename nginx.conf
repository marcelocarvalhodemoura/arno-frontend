server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Página estática pública (sem login), exigida pela Meta / WhatsApp Business.
    location = /privacidade {
        try_files /privacidade/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
