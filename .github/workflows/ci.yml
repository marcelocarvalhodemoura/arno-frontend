name: arno-frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Tesouraria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependências
        run: npm ci

      - name: Testes
        run: npm run test:unit

      - name: Imagem
        run: docker build -t arno-frontend:${{ github.sha }} .

      - name: Publicar container
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: bash deploy/ship.sh arno-frontend arno-frontend:${{ github.sha }} 8081 80 - /
